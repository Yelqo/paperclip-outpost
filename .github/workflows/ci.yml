name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and public workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: '2026.8.6'

      - name: Check generated compatibility declarations
        run: node scripts/generate-versions.mjs --check

      - name: Check Go formatting
        run: pnpm check:format

      - name: Prepare Linux protection tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          # Allow the tested sandbox to create user namespaces on this disposable runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc --dev /dev -- true

      - name: Prepare pinned Paperclip host and SDK
        run: pnpm prepare:host

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned Pi and pi-config
        env:
          OUTPOST_PI_CONFIG_READ_TOKEN: ${{ secrets.PI_CONFIG_READ_TOKEN }}
        run: pnpm prepare:pi

      - name: Check TypeScript and Go
        run: pnpm check

      - name: Build plugin and daemon
        run: pnpm build

      - name: Check patched host TypeScript
        run: pnpm --dir .cache/paperclip/server exec tsc --noEmit

      - name: Test host routing and authorization regressions
        run: >-
          pnpm --dir .cache/paperclip/server exec vitest run
          src/__tests__/plugin-scoped-api-routes.test.ts
          src/__tests__/plugin-routes-authz.test.ts
          src/__tests__/environment-selection-route-guards.test.ts
          src/__tests__/environment-service.test.ts
          src/__tests__/live-events-ws.test.ts
          src/__tests__/plugin-worker-manager.test.ts
          src/__tests__/plugin-websocket-timeouts.test.ts
          src/__tests__/environment-execution-target.test.ts
          src/__tests__/environment-execution-target-duplex.test.ts
          src/__tests__/plugin-environment-driver-seam.test.ts

      - name: Test public host, plugin, and daemon workflow
        run: pnpm test
